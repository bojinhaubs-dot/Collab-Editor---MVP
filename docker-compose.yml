services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: collab_mvp
      MYSQL_USER: collab
      MYSQL_PASSWORD: collab_demo_password
      MYSQL_ROOT_PASSWORD: root_demo_password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3309:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
